{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión — Ventas Ingenio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="{% static 'css/tokens.css' %}" rel="stylesheet">
  <link href="{% static 'css/app.css' %}" rel="stylesheet">
  <link rel="icon" href="{% static 'img/logo.ico' %}" type="image/x-icon">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-card-header">
        <img src="{% static 'img/logo modelo ingenio blanco.png' %}" alt="Ingenio">
        <h1 class="h4 mb-1 fw-semibold">Ventas Ingenio</h1>
        <p class="small mb-0 opacity-75">Sistema de gestión de ventas</p>
      </div>
      <div class="auth-card-body">
        <form method="post" novalidate>
          {% csrf_token %}
          <div class="mb-3">
            <label for="id_username" class="form-label">Usuario</label>
            <div class="input-group">
              <span class="input-group-text bg-white"><i class="bi bi-person text-muted"></i></span>
              <input type="text" name="username" id="id_username" class="form-control"
                     placeholder="Tu usuario" required autofocus>
            </div>
          </div>
          <div class="mb-4">
            <label for="id_password" class="form-label">Contraseña</label>
            <div class="input-group">
              <span class="input-group-text bg-white"><i class="bi bi-lock text-muted"></i></span>
              <input type="password" name="password" id="id_password" class="form-control"
                     placeholder="Tu contraseña" required>
            </div>
          </div>
          {% if form.errors %}
          <div class="alert alert-danger d-flex align-items-center gap-2 py-2 small" role="alert">
            <i class="bi bi-exclamation-triangle-fill"></i>
            Usuario o contraseña incorrectos
          </div>
          {% endif %}
          <button type="submit" class="btn btn-brand w-100 py-2">
            <i class="bi bi-box-arrow-in-right me-1"></i> Iniciar sesión
          </button>
        </form>
        <p class="text-center text-muted small mt-4 mb-0">© {% now "Y" %} Modelo Ingenio</p>
      </div>
    </div>
  </div>
</body>
</html>
